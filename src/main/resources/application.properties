spring.application.name=starter_p
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.output.ansi.enabled=always
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-lifetime=${JWT_ACCESS_TOKEN_LIFETIME:15m}
app.jwt.refresh-token-lifetime=${JWT_REFRESH_TOKEN_LIFETIME:7d}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.security.cookie-secure=${APP_COOKIE_SECURE:false}
app.security.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}
server.port=${PORT:8080}